# Release pipeline.
#
# 1. release-please: on every push to main, opens or updates a release PR from the Conventional Commit messages
#    (feat:, fix:, ...) with the next version and CHANGELOG.md entry. Merging that PR tags the release and creates
#    the GitHub release.
# 2. build: when a release was just created, builds the mod against the stripped game references from the private
#    refs repo, attaches NoFussLocks_<version>.zip to the GitHub release and uploads it to Nexus Mods.
#    To redo this for an existing release (e.g. after a failed build), run the workflow by hand with its tag.
#
# Repository settings this needs (Settings -> Secrets and variables -> Actions):
#   secret   GAME_REFS_TOKEN    read-only token for the private refs repo (fine-grained PAT, Contents: read)
#   variable GAME_REFS_REPO     the private refs repo, e.g. Maddog2050/Obenseuer-GameRefs
#   secret   NEXUSMODS_API_KEY  Nexus Mods API key (https://www.nexusmods.com/settings/api-keys)
#   variable NEXUS_FILE_ID      file ID of the main file on the Nexus page; the Nexus upload is skipped while unset
#   variable NEXUS_MOD_ID       global mod ID for the changelog (Files tab -> Advanced; not the 92 in the page URL);
#                               the changelog is skipped while unset
# and Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: release-please

on:
  push:
    branches:
      - main
  # Run it by hand (Actions -> release-please -> Run workflow), e.g. to recreate a closed release PR.
  workflow_dispatch:
    inputs:
      tag:
        description: Build and upload an existing release instead, e.g. v0.1.0 (empty = run release-please)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.target.outputs.build }}
      tag_name: ${{ steps.target.outputs.tag_name }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - id: release
        if: inputs.tag == ''
        uses: googleapis/release-please-action@v5

      # Which release to build: the tag given by hand, else the release release-please just created (if any).
      - id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            if [[ ! $INPUT_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::tag must look like v1.2.3, got '$INPUT_TAG'"
              exit 1
            fi
            TAG=$INPUT_TAG VERSION=${BASH_REMATCH[1]} CREATED=true
          fi
          if [ "$CREATED" = true ]; then
            { echo build=true; echo "tag_name=$TAG"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-please
    if: needs.release-please.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      # Not called ZIP: Info-ZIP's zip reads $ZIP as default arguments, which turned the file name into the archive.
      ZIP_FILE: NoFussLocks_${{ needs.release-please.outputs.version }}.zip
    steps:
      # persist-credentials: false on both checkouts: no later step needs Git access (gh uses GH_TOKEN), so the
      # tokens are used for the clone only and not left where the build or third-party actions could read them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # Stripped game/Unity dlls (names and signatures only) and BepInEx; never copied into the build output or zip.
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_REFS_REPO }}
          token: ${{ secrets.GAME_REFS_TOKEN }}
          path: game-refs
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: >
          dotnet build NoFussLocks -c Release -nologo
          -p:GameDir="$GITHUB_WORKSPACE/game-refs"
          -p:ManagedDir="$GITHUB_WORKSPACE/game-refs/Managed"
          -p:BepInExCore="$GITHUB_WORKSPACE/game-refs/BepInEx"

      - name: Package
        run: |
          dir=stage/BepInEx/plugins/NoFussLocks
          mkdir -p "$dir"
          cp NoFussLocks/bin/Release/NoFussLocks.dll LICENSE README.md "$dir/"
          (cd stage && zip -r -X "../$ZIP_FILE" BepInEx)
          # The zip may only contain the mod's own files.
          unzip -Z1 "$ZIP_FILE" | grep -v '/$' | sort > actual.txt
          printf '%s\n' LICENSE NoFussLocks.dll README.md | sed 's#^#BepInEx/plugins/NoFussLocks/#' | sort > expected.txt
          diff -u expected.txt actual.txt

      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ZIP_FILE" --clobber

      - name: Read the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'body<<EOF_NOTES'
            gh release view "$TAG" --json body --jq .body
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        if: vars.NEXUS_FILE_ID != ''
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ env.ZIP_FILE }}
          version: ${{ env.VERSION }}
          display_name: No-Fuss Locks ${{ env.VERSION }}
          changelog: ${{ vars.NEXUS_MOD_ID != '' && steps.notes.outputs.body || '' }}
          update_mod_version: true
          archive_existing_version: true
